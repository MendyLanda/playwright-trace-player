name: Publish package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm version
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Read package metadata
        id: package
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs')
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${packageJson.name}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${packageJson.version}\n`)
          NODE

      - name: Check npm registry
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published != 'true'
        run: npm ci

      - name: Check package
        if: steps.registry.outputs.published != 'true'
        run: npm run check

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish

      - name: Ensure GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v${PACKAGE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
